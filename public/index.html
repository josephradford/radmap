<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>radmap</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0d0c0a" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<style>
  :root {
    --ink: #f2ebdd;
    --ink-dim: #a89f8b;
    --panel: rgba(26,24,20,0.82);
    --panel-solid: #1a1814;
    --hair: rgba(242,235,221,0.14);
    --amber: #e8843b;
    --amber-soft: rgba(232,132,59,0.18);
    --gps: #3bd17a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0d0c0a; color: var(--ink); font-family: var(--sans); overflow: hidden; }
  #map { position: absolute; inset: 0; background: #0d0c0a; }

  .brand {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 1000;
    display: flex; align-items: center; gap: 9px; padding: 8px 13px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hair); border-radius: 11px;
    box-shadow: 0 6px 22px rgba(0,0,0,.35);
  }
  .brand .mk { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  .brand b { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }

  .readout {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 1000;
    min-width: 188px; padding: 11px 13px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hair); border-radius: 11px;
    box-shadow: 0 6px 22px rgba(0,0,0,.35); font-family: var(--mono);
  }
  .readout .row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .readout .lbl { font-size: 9px; letter-spacing: .14em; color: var(--ink-dim); text-transform: uppercase; }
  .readout .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .readout .dms { font-size: 11px; color: var(--ink-dim); text-align: right; margin-top: 3px; letter-spacing: .02em; }
  .readout .mga { font-size: 11px; color: var(--amber); text-align: right; margin-top: 3px; letter-spacing: .02em; }
  .readout hr { border: none; border-top: 1px solid var(--hair); margin: 9px 0; }
  .gpsline { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
  .gpsdot { width: 8px; height: 8px; border-radius: 50%; background: #6b6354; transition: background .3s; }
  .gpsdot.fix { background: var(--gps); box-shadow: 0 0 8px var(--gps); }
  .gpsdot.err { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  .cross { position: absolute; top: 50%; left: 50%; z-index: 600; pointer-events: none; transform: translate(-50%,-50%); }
  .cross::before, .cross::after { content: ""; position: absolute; background: rgba(13,12,10,.6); }
  .cross::before { width: 1px; height: 34px; left: 0; top: -17px; box-shadow: 0 0 0 1px rgba(242,235,221,.35); }
  .cross::after { height: 1px; width: 34px; top: 0; left: -17px; box-shadow: 0 0 0 1px rgba(242,235,221,.35); }
  .cross i { position: absolute; width: 7px; height: 7px; border: 1.5px solid var(--amber); border-radius: 50%; left: -3.5px; top: -3.5px; background: rgba(13,12,10,.4); }

  .bar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); z-index: 1000;
    display: flex; gap: 8px; padding: 8px;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hair); border-radius: 15px; box-shadow: 0 8px 28px rgba(0,0,0,.4);
  }
  .btn {
    appearance: none; border: 1px solid var(--hair); background: rgba(242,235,221,.04); color: var(--ink);
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
    padding: 11px 13px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 62px; transition: background .15s, border-color .15s, transform .05s;
  }
  .btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .btn:active { transform: scale(.94); }
  .btn.on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  .btn.on svg { stroke: var(--amber); }

  .me { position: relative; }
  .me .pulse { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: var(--gps); opacity: .25; animation: pulse 2.2s ease-out infinite; }
  .me .core { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--gps); border: 2.5px solid #0d0c0a; box-shadow: 0 0 10px rgba(59,209,122,.7); }
  @keyframes pulse { 0% { transform: scale(.5); opacity: .45; } 100% { transform: scale(1.6); opacity: 0; } }

  .leaflet-control-attribution { font-family: var(--mono); font-size: 9px !important; background: rgba(13,12,10,.6) !important; color: var(--ink-dim) !important; }
  .leaflet-control-attribution a { color: var(--ink-dim) !important; }
  .leaflet-control-scale-line { font-family: var(--mono) !important; font-size: 9px !important; background: var(--panel) !important; color: var(--ink) !important; border-color: var(--hair) !important; border-top: none !important; }
  .leaflet-bar a { background: var(--panel-solid) !important; color: var(--ink) !important; border-color: var(--hair) !important; }

  .toast {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 1100; max-width: 84vw;
    background: var(--panel-solid); border: 1px solid var(--amber); color: var(--ink); font-family: var(--mono); font-size: 11px;
    padding: 10px 14px; border-radius: 10px; line-height: 1.5; box-shadow: 0 8px 28px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
  .dl-overlay {
    position: absolute; inset: 0; z-index: 2000; background: rgba(13,12,10,.92);
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: max(60px, calc(env(safe-area-inset-top) + 20px)) 16px max(20px, env(safe-area-inset-bottom)) 16px;
    overflow-y: auto;
  }
  .dl-overlay.open { display: flex; }
  .dl-header {
    width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .dl-header h2 { font-family: var(--mono); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin: 0; }
  .dl-close {
    appearance: none; background: none; border: 1px solid var(--hair); color: var(--ink); font-family: var(--mono);
    font-size: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: .1em;
  }
  .dl-region {
    width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--hair); border-radius: 11px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .dl-region .name { font-family: var(--mono); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .dl-region .info { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); margin-bottom: 8px; }
  .dl-region .bar-track { width: 100%; height: 4px; background: var(--hair); border-radius: 2px; margin-bottom: 8px; overflow: hidden; display: none; }
  .dl-region .bar-fill { height: 100%; background: var(--amber); border-radius: 2px; width: 0%; transition: width .2s; }
  .dl-region.downloading .bar-track { display: block; }
  .dl-region .actions { display: flex; gap: 8px; }
  .dl-region .dl-btn {
    appearance: none; border: 1px solid var(--hair); background: rgba(242,235,221,.06); color: var(--ink);
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
  }
  .dl-region .dl-btn:active { transform: scale(.96); }
  .dl-region .dl-btn.ready { border-color: var(--gps); color: var(--gps); }
  .dl-region .dl-btn.delete { border-color: var(--amber); color: var(--amber); }
  .dl-all {
    width: 100%; max-width: 400px; margin-top: 6px;
  }
  .dl-all .dl-btn {
    width: 100%; appearance: none; border: 1px solid var(--amber); background: var(--amber-soft); color: var(--amber);
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    padding: 12px; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="brand"><span class="mk"></span><b>radmap</b></div>

<div class="readout">
  <div class="row"><span class="lbl">Lat</span><span class="val" id="vlat">—</span></div>
  <div class="row"><span class="lbl">Lon</span><span class="val" id="vlon">—</span></div>
  <div class="dms" id="vdms">crosshair · centre of map</div>
  <div class="mga" id="vmga"></div>
  <hr/>
  <div class="gpsline"><span class="gpsdot" id="gdot"></span><span id="gtxt">GPS idle</span></div>
</div>

<div class="cross"><i></i></div>

<div class="bar">
  <button class="btn" id="bLocate" title="Find me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><circle cx="12" cy="12" r="2"/></svg>
    Locate
  </button>
  <button class="btn" id="bFollow" title="Follow position">
    <svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
    Follow
  </button>
  <button class="btn" id="bDownload" title="Manage offline maps">
    <svg viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
    Maps
  </button>
</div>

<div class="toast" id="toast"></div>

<div class="dl-overlay" id="dlOverlay">
  <div class="dl-header">
    <h2>Offline Maps</h2>
    <button class="dl-close" id="dlClose">Close</button>
  </div>
  <div id="dlList"></div>
  <div class="dl-all"><button class="dl-btn" id="dlAll">Download All</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { toMGA, formatMGA, formatGridRef } from './lib/mga.mjs';
import { getTile, storeTilesBatch, saveRegionMeta, getAllRegionMeta, deleteRegionMeta, deleteTiles } from './lib/tile-store.mjs';
import { readArchiveIndex, getTileFromBuffer } from './lib/tile-archive.mjs';
import { REGIONS, ZOOM_MIN, ZOOM_MAX } from './lib/regions.mjs';
import { tilesInBbox } from './lib/tile-math.mjs';
// ---- map setup ----
const ATTR = '© State of NSW (Spatial Services) — CC BY 4.0';
const NSW_TILE_URL = 'https://maps.six.nsw.gov.au/arcgis/rest/services/public/NSW_Topo_Map/MapServer/tile';

const OfflineTopoLayer = L.GridLayer.extend({
  createTile(coords, done) {
    const tile = document.createElement('img');
    tile.setAttribute('role', 'presentation');
    const { x, y, z } = coords;

    getTile(z, x, y).then(blob => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        tile.onload = () => { URL.revokeObjectURL(url); done(null, tile); };
        tile.onerror = () => { URL.revokeObjectURL(url); this._tryOnline(tile, z, x, y, done); };
        tile.src = url;
      } else {
        this._tryOnline(tile, z, x, y, done);
      }
    }).catch(() => {
      this._tryOnline(tile, z, x, y, done);
    });

    return tile;
  },

  _tryOnline(tile, z, x, y, done) {
    tile.onload = () => done(null, tile);
    tile.onerror = () => done(new Error('Tile unavailable'), tile);
    tile.crossOrigin = 'anonymous';
    tile.src = `${NSW_TILE_URL}/${z}/${y}/${x}`;
  },
});

const retina = L.Browser.retina;
const topo = new OfflineTopoLayer({
  maxNativeZoom: 16, maxZoom: 18, attribution: ATTR,
  tileSize: retina ? 128 : 256, zoomOffset: retina ? 1 : 0,
});
const map = L.map('map', { zoomControl: false, layers: [topo] }).setView([-33.7126, 150.3119], 14);
L.control.zoom({ position: 'topleft' }).addTo(map);
L.control.scale({ position: 'bottomleft', metric: true, imperial: false, maxWidth: 140 }).addTo(map);

// ---- coordinate readout ----
function dms(v, pos, neg) {
  const h = v >= 0 ? pos : neg;
  v = Math.abs(v);
  const d = Math.floor(v);
  const m = Math.floor((v - d) * 60);
  const s = ((v - d - m / 60) * 3600).toFixed(1);
  return `${d}°${String(m).padStart(2, '0')}'${s}"${h}`;
}

function updateCentre() {
  const c = map.getCenter();
  document.getElementById('vlat').textContent = c.lat.toFixed(5);
  document.getElementById('vlon').textContent = c.lng.toFixed(5);
  document.getElementById('vdms').textContent = `${dms(c.lat, 'N', 'S')}  ${dms(c.lng, 'E', 'W')}`;
  const mga = toMGA(c.lat, c.lng);
  document.getElementById('vmga').textContent = `${formatMGA(mga)}  GR ${formatGridRef(mga)}`;
}
map.on('move', updateCentre);
updateCentre();

// ---- toast ----
let toastT;
function toast(msg, ms = 4200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), ms);
}

// ---- GPS ----
let watchId = null, meMarker = null, accCircle = null, follow = false, haveFix = false;
const gdot = document.getElementById('gdot');
const gtxt = document.getElementById('gtxt');
const meIcon = L.divIcon({
  className: '',
  html: '<div class="me"><div class="pulse"></div><div class="core"></div></div>',
  iconSize: [0, 0],
});

function setGps(state, txt) {
  gdot.className = 'gpsdot' + (state ? ' ' + state : '');
  gtxt.textContent = txt;
}

function onPos(p) {
  haveFix = true;
  const { latitude: lat, longitude: lon, accuracy: acc } = p.coords;
  const ll = [lat, lon];
  if (!meMarker) {
    meMarker = L.marker(ll, { icon: meIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
  } else {
    meMarker.setLatLng(ll);
  }
  if (!accCircle) {
    accCircle = L.circle(ll, { radius: acc, color: '#3bd17a', weight: 1, fillColor: '#3bd17a', fillOpacity: .08 }).addTo(map);
  } else {
    accCircle.setLatLng(ll);
    accCircle.setRadius(acc);
  }
  setGps('fix', `Fix · ±${Math.round(acc)} m`);
  if (follow) map.setView(ll, Math.max(map.getZoom(), 15), { animate: true });
}

function onErr(err) {
  setGps('err', 'No GPS');
  let m = 'Location unavailable.';
  if (err.code === 1) m = 'Location permission denied.';
  else if (err.code === 2) m = 'Position unavailable — need clearer sky or a moment to lock.';
  else if (err.code === 3) m = 'GPS timed out. Try Locate again.';
  if (!window.isSecureContext) m = 'GPS needs HTTPS. Serve over HTTPS or localhost.';
  toast(m, 6000);
}

function startGps() {
  if (!('geolocation' in navigator)) { setGps('err', 'No GPS'); toast('No geolocation API.'); return; }
  setGps('', 'Locating…');
  navigator.geolocation.getCurrentPosition(
    p => { onPos(p); map.setView([p.coords.latitude, p.coords.longitude], 15); },
    onErr,
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
  );
  if (watchId === null) {
    watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, timeout: 15000, maximumAge: 2000 });
  }
}

document.getElementById('bLocate').addEventListener('click', startGps);
document.getElementById('bFollow').addEventListener('click', e => {
  follow = !follow;
  e.currentTarget.classList.toggle('on', follow);
  if (follow) {
    if (!haveFix) startGps();
    else if (meMarker) map.setView(meMarker.getLatLng(), Math.max(map.getZoom(), 15));
  }
});
map.on('dragstart', () => {
  if (follow) { follow = false; document.getElementById('bFollow').classList.remove('on'); }
});

// ---- download manager ----
const dlOverlay = document.getElementById('dlOverlay');
const dlList = document.getElementById('dlList');

document.getElementById('bDownload').addEventListener('click', () => {
  openDownloadPanel();
});
document.getElementById('dlClose').addEventListener('click', () => {
  dlOverlay.classList.remove('open');
});
document.getElementById('dlAll').addEventListener('click', () => {
  downloadAllRegions();
});

async function openDownloadPanel() {
  dlOverlay.classList.add('open');
  await renderRegionList();
}

async function renderRegionList() {
  const downloaded = await getAllRegionMeta();
  const downloadedIds = new Set(downloaded.map(r => r.id));

  let manifestData = [];
  try {
    const res = await fetch('./tiles/manifest.json');
    if (res.ok) manifestData = await res.json();
  } catch {}

  const manifestMap = new Map(manifestData.map(m => [m.id, m]));

  dlList.innerHTML = '';
  for (const region of REGIONS) {
    const manifest = manifestMap.get(region.id);
    const isReady = downloadedIds.has(region.id);

    const div = document.createElement('div');
    div.className = 'dl-region';
    div.id = `dl-${region.id}`;

    const sizeMB = manifest ? (manifest.fileSize / 1024 / 1024).toFixed(0) : '?';
    const tileN = manifest ? manifest.tileCount.toLocaleString() : '?';

    div.innerHTML = `
      <div class="name">${region.name}</div>
      <div class="info">${tileN} tiles · ${sizeMB} MB</div>
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="actions">
        ${isReady
          ? `<button class="dl-btn ready" disabled>Ready</button><button class="dl-btn delete" data-region="${region.id}">Delete</button>`
          : manifest
            ? `<button class="dl-btn" data-download="${region.id}">Download</button>`
            : `<button class="dl-btn" disabled>Not available</button>`
        }
      </div>
    `;
    dlList.appendChild(div);
  }

  dlList.querySelectorAll('[data-download]').forEach(btn => {
    btn.addEventListener('click', () => downloadRegion(btn.dataset.download));
  });
  dlList.querySelectorAll('[data-region]').forEach(btn => {
    btn.addEventListener('click', () => deleteRegion(btn.dataset.region));
  });
}

async function downloadRegion(regionId) {
  const region = REGIONS.find(r => r.id === regionId);
  if (!region) return;

  const div = document.getElementById(`dl-${regionId}`);
  div.classList.add('downloading');
  const fill = div.querySelector('.bar-fill');
  const actions = div.querySelector('.actions');
  actions.innerHTML = '<span style="font-family:var(--mono);font-size:10px;color:var(--ink-dim)">Downloading…</span>';

  try {
    const res = await fetch(`./tiles/${regionId}.tiles`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const total = parseInt(res.headers.get('content-length') || '0', 10);
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total > 0) fill.style.width = `${Math.round(100 * received / total)}%`;
    }

    actions.innerHTML = '<span style="font-family:var(--mono);font-size:10px;color:var(--ink-dim)">Unpacking…</span>';
    fill.style.width = '100%';

    const combined = new Uint8Array(received);
    let pos = 0;
    for (const chunk of chunks) {
      combined.set(chunk, pos);
      pos += chunk.length;
    }

    const index = readArchiveIndex(combined.buffer);
    const BATCH_SIZE = 200;
    let batch = [];

    for (let i = 0; i < index.entries.length; i++) {
      const entry = index.entries[i];
      const tile = getTileFromBuffer(combined.buffer, index, entry.z, entry.x, entry.y);
      if (tile) {
        const blob = new Blob([tile.data], { type: tile.format });
        batch.push({ z: entry.z, x: entry.x, y: entry.y, blob });
      }
      if (batch.length >= BATCH_SIZE || i === index.entries.length - 1) {
        await storeTilesBatch(batch);
        batch = [];
        fill.style.width = `${Math.round(100 * (i + 1) / index.entries.length)}%`;
      }
    }

    await saveRegionMeta({
      id: regionId,
      name: region.name,
      bounds: region.bounds,
      tileCount: index.tileCount,
      downloadedAt: new Date().toISOString(),
    });

    div.classList.remove('downloading');
    await renderRegionList();
  } catch (err) {
    div.classList.remove('downloading');
    actions.innerHTML = `<span style="font-family:var(--mono);font-size:10px;color:var(--amber)">Failed: ${err.message}</span>`;
  }
}

async function downloadAllRegions() {
  const downloaded = await getAllRegionMeta();
  const downloadedIds = new Set(downloaded.map(r => r.id));
  for (const region of REGIONS) {
    if (!downloadedIds.has(region.id)) {
      await downloadRegion(region.id);
    }
  }
}

async function deleteRegion(regionId) {
  const region = REGIONS.find(r => r.id === regionId);
  if (!region) return;

  const { bounds } = region;
  const keys = [];
  for (let z = ZOOM_MIN; z <= ZOOM_MAX; z++) {
    for (const t of tilesInBbox(bounds.south, bounds.west, bounds.north, bounds.east, z)) {
      keys.push(`${t.z}/${t.x}/${t.y}`);
    }
  }

  await deleteTiles(keys);
  await deleteRegionMeta(regionId);
  await renderRegionList();
}

// ---- request persistent storage ----
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist();
}

// ---- service worker ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
